name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The test suite exercises the parser, serial doubles, recording,
      # training, and switch paths; it does not import the Qt GUI stack,
      # so PySide6/pyqtgraph are intentionally not installed here.
      - name: Install dependencies
        run: pip install pyserial pytest
      - name: Run tests
        run: pytest -q
