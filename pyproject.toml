[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reson"
version = "0.1.0"
description = "EMG-driven binary switch pipeline from ESP32"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pyserial>=3.5",
  "PySide6>=6.7,<6.8",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
ml = [
  "torch>=2.2",
]

[project.scripts]
reson-debug = "reson.apps.debug_monitor:main"
reson-prompt-record = "reson.apps.prompt_record_app:main"
reson-record = "reson.apps.record_app:main"
reson-switch = "reson.apps.switch_app:main"
reson-train = "reson.apps.train_app:main"
reson-study = "reson.apps.study_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
